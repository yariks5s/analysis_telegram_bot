tutorial:
  welcome:
    title: "🎉 Ласкаво просимо до CryptoBot!"
    content: |
      Я ваш персональний помічник для аналізу криптовалютного ринку. Я допоможу вам аналізувати графіки криптовалют з просунутими технічними індикаторами.
      
      Це коротке навчання покаже вам, як використовувати мої основні функції. Ви можете пропустити навчання або повернутися до нього будь-коли за допомогою команди /tutorial.

  chart:
    title: "📊 Аналіз графіка"
    content: |
      Основна команда для отримання аналізу графіка:
      
      <code>/chart СИМВОЛ ДОВЖИНА ІНТЕРВАЛ ДОПУСК</code>
      
      Наприклад: <code>/chart BTCUSDT 48 1h 0.05</code>
      
      Це дасть вам 48-свічковий годинний графік для BTC/USDT з допуском 0.05 для визначення рівнів ліквідності.
      
      Спробуйте або продовжуйте, щоб дізнатися більше!

  preferences:
    title: "⚙️ Налаштування індикаторів"
    content: |
      Ви можете налаштувати, які індикатори відображаються на графіках, за допомогою команди <code>/preferences</code>.
      
      Відкриється інтерактивне меню, де ви можете увімкнути або вимкнути:
      • Ордер-блоки
      • Зони справедливої вартості (FVG)
      • Рівні ліквідності
      • Брейкер-блоки
      • І змінити налаштування відображення
      
      Ваші налаштування будуть збережені для майбутніх запитів.

  signals:
    title: "🔔 Автоматичні сигнали"
    content: |
      Хочете отримувати автоматичні сповіщення? Налаштуйте сигнальні оповіщення за допомогою:
      
      <code>/create_signal СИМВОЛ ХВИЛИНИ [ГРАФІК]</code>
      
      Наприклад: <code>/create_signal BTCUSDT 60 true</code>
      
      Це надсилатиме вам сповіщення з графіком кожні 60 хвилин для BTC/USDT.
      
      Керувати сигналами можна командою <code>/manage_signals</code>.

  parameters:
    title: "🔧 Розширені параметри"
    content: |
      Тонке налаштування параметрів індикаторів через команду <code>/parameters</code>.
      
      Ви можете налаштувати:
      • Період ATR: для розрахунку середнього істинного діапазону
      • Мін. розмір FVG: мінімальний розмір зон справедливої вартості
      
      Ці налаштування впливають на розрахунок і відображення індикаторів.

  completed:
    title: "🚀 Навчання завершено!"
    content: |
      Чудово! Ви завершили навчання CryptoBot.
      
      Пам'ятайте, ви завжди можете отримати допомогу:
      • <code>/help</code> - Загальна довідка
      • <code>/help КОМАНДА</code> - Довідка по конкретній команді
      
      Готові почати? Спробуйте <code>/chart BTCUSDT 48 1h 0.05</code> для аналізу BTC/USDT!

  buttons:
    continue: "Продовжити"
    skip_tutorial: "Пропустити навчання"
    skip_to_end: "Пропустити до кінця"
    complete: "Завершити навчання"
    view_commands: "Показати команди"
    back_to_tutorial: "Назад до навчання"

  welcome_back:
    title: "З поверненням до CryptoBot!"
    content: |
      Ви вже завершили навчання. Що хочете зробити?
      
      • Отримати графік: <code>/chart BTCUSDT 48 1h 0.05</code>
      • Налаштувати вподобання: <code>/preferences</code>
      • Створити сигнали: <code>/create_signal</code>
      • Повторити навчання: <code>/tutorial</code>

  commands_list:
    title: "Доступні команди:"
    content: |
      <code>/chart</code> - Отримати графік з індикаторами
      <code>/text_result</code> - Отримати текстовий аналіз
      <code>/preferences</code> - Налаштувати вподобання індикаторів
      <code>/parameters</code> - Тонке налаштування індикаторів
      <code>/create_signal</code> - Налаштувати автоматичні сигнали
      <code>/manage_signals</code> - Керування сигналами
      <code>/help</code> - Отримати довідку
      <code>/tutorial</code> - Повторити навчання
      <code>/language</code> - Змінити мову

  happy_trading: "Вдалої торгівлі! 📈\n\nВикористовуйте <code>/help</code> для отримання допомоги."

