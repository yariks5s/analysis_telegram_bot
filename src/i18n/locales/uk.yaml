help:
  title: "Довідка CryptoBot"
  main: |
    Ось основні команди:
    
    <b>/chart &lt;символ&gt; &lt;довжина&gt; &lt;інтервал&gt; &lt;допуск&gt;</b>
    <b>/text_result &lt;символ&gt; &lt;довжина&gt; &lt;інтервал&gt; &lt;допуск&gt;</b>
    <b>/history &lt;символ&gt; &lt;довжина&gt; &lt;інтервал&gt; &lt;допуск&gt; &lt;час&gt;</b>
    <b>/preferences</b>
    <b>/create_signal &lt;символ&gt; &lt;хвилини&gt; [&lt;з_графіком&gt;]</b>
    <b>/delete_signal &lt;символ&gt;</b>
    <b>/manage_signals</b>
    <b>/sql &lt;запит&gt;</b>
    <b>/tables</b>
    <b>/schema &lt;назва_таблиці&gt;</b>
    <b>/language</b>
    <b>/help &lt;команда&gt;</b>
    
    Введіть <code>/help &lt;команда&gt;</code> для детальної довідки.
    
    Приклад: <code>/help chart</code>
    
    Для деталей див. README або зв'яжіться з розробником (@yarik_is_working).

  commands:
    parameters: |
      <b>/parameters</b>
      Відкрити інтерактивне меню для налаштування параметрів індикаторів.

    chart: |
      <b>/chart &lt;символ&gt; &lt;довжина&gt; &lt;інтервал&gt; &lt;допуск&gt;</b>
      Отримати свічковий графік з усіма увімкненими індикаторами.
      
      Приклад: <code>/chart BTCUSDT 48 1h 0.05</code>

    text_result: |
      <b>/text_result &lt;символ&gt; &lt;довжина&gt; &lt;інтервал&gt; &lt;допуск&gt;</b>
      Отримати текстовий звіт всіх виявлених індикаторів.
      
      Приклад: <code>/text_result ETHUSDT 24 15m 0.03</code>

    history: |
      <b>/history &lt;символ&gt; &lt;довжина&gt; &lt;інтервал&gt; &lt;допуск&gt; &lt;час&gt;</b>
      Отримати свічковий графік для історичних даних.
      
      Приклад: <code>/history BTCUSDT 48 1h 0.05 1700000000</code>

    preferences: |
      <b>/preferences</b>
      Відкрити інтерактивне меню для вибору індикаторів та налаштувань графіка.

    create_signal: |
      <b>/create_signal &lt;символ&gt; &lt;хвилини&gt; [&lt;з_графіком&gt;]</b>
      Почати отримувати автоматичні сигнали для пари із заданою частотою.
      
      Приклад: <code>/create_signal BTCUSDT 60 true</code>

    delete_signal: |
      <b>/delete_signal &lt;символ&gt;</b>
      Зупинити автоматичні сигнали для пари.

    manage_signals: |
      <b>/manage_signals</b>
      Відкрити інтерактивне меню для перегляду, додавання або видалення сигналів.

    help: |
      <b>/help</b>
      Показати загальне повідомлення довідки.

    sql: |
      <b>/sql &lt;запит&gt;</b>
      Виконати SQL-запит до бази даних.

    tables: |
      <b>/tables</b>
      Показати список усіх доступних таблиць у базі даних.

    schema: |
      <b>/schema &lt;назва_таблиці&gt;</b>
      Показати структуру конкретної таблиці.

    language: |
      <b>/language</b>
      Змінити мову бота.

