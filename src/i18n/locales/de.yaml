tutorial:
  welcome:
    title: "🎉 Willkommen bei CryptoBot!"
    content: |
      Ich bin Ihr persönlicher Assistent für Krypto-Marktanalysen. Ich kann Ihnen helfen, Kryptowährungs-Charts mit fortgeschrittenen technischen Indikatoren zu analysieren.
      
      Dieses kurze Tutorial zeigt Ihnen, wie Sie meine Hauptfunktionen nutzen können. Sie können das Tutorial überspringen oder jederzeit mit dem Befehl /tutorial darauf zurückkommen.

  chart:
    title: "📊 Chart-Analyse"
    content: |
      Der grundlegende Befehl für eine Chart-Analyse ist:
      
      <code>/chart SYMBOL LÄNGE INTERVALL TOLERANZ</code>
      
      Zum Beispiel: <code>/chart BTCUSDT 48 1h 0.05</code>
      
      Dies gibt Ihnen ein 48-Kerzen, 1-Stunden-Chart für BTC/USDT mit einer Toleranz von 0.05 für die Erkennung von Liquiditätsniveaus.
      
      Probieren Sie es aus oder fahren Sie fort, um mehr zu erfahren!

  preferences:
    title: "⚙️ Indikatoren anpassen"
    content: |
      Sie können mit dem Befehl <code>/preferences</code> anpassen, welche Indikatoren auf Ihren Charts erscheinen.
      
      Dies öffnet ein interaktives Menü, in dem Sie aktivieren oder deaktivieren können:
      • Order Blocks
      • Fair Value Gaps (FVGs)
      • Liquiditätsniveaus
      • Breaker Blocks
      • Und Anzeigeoptionen ändern
      
      Ihre Einstellungen werden für zukünftige Anfragen gespeichert.

  signals:
    title: "🔔 Automatische Signale"
    content: |
      Möchten Sie automatische Benachrichtigungen erhalten? Richten Sie Signal-Alarme ein mit:
      
      <code>/create_signal SYMBOL MINUTEN [CHART]</code>
      
      Zum Beispiel: <code>/create_signal BTCUSDT 60 true</code>
      
      Dies sendet Ihnen alle 60 Minuten eine Benachrichtigung mit Chart für BTC/USDT.
      
      Sie können Ihre Signale mit dem Befehl <code>/manage_signals</code> verwalten.

  parameters:
    title: "🔧 Erweiterte Parameter"
    content: |
      Feinabstimmung der Indikator-Parameter mit dem Befehl <code>/parameters</code>.
      
      Sie können anpassen:
      • ATR-Periode: für die Berechnung der Average True Range
      • FVG Min. Größe: minimale Größe für Fair Value Gaps
      
      Diese Einstellungen beeinflussen, wie Indikatoren berechnet und angezeigt werden.

  completed:
    title: "🚀 Tutorial abgeschlossen!"
    content: |
      Großartig! Sie haben das CryptoBot-Tutorial abgeschlossen.
      
      Denken Sie daran, Sie können jederzeit Hilfe bekommen mit:
      • <code>/help</code> - Allgemeine Hilfe
      • <code>/help BEFEHL</code> - Hilfe für einen bestimmten Befehl
      
      Bereit anzufangen? Probieren Sie <code>/chart BTCUSDT 48 1h 0.05</code> für eine BTC/USDT-Analyse!

  buttons:
    continue: "Weiter"
    skip_tutorial: "Tutorial überspringen"
    skip_to_end: "Zum Ende springen"
    complete: "Tutorial abschließen"
    view_commands: "Befehle anzeigen"
    back_to_tutorial: "Zurück zum Tutorial"

  welcome_back:
    title: "Willkommen zurück bei CryptoBot!"
    content: |
      Sie haben das Tutorial bereits abgeschlossen. Was möchten Sie tun?
      
      • Ein Chart erhalten: <code>/chart BTCUSDT 48 1h 0.05</code>
      • Einstellungen festlegen: <code>/preferences</code>
      • Signale erstellen: <code>/create_signal</code>
      • Tutorial wiederholen: <code>/tutorial</code>

  commands_list:
    title: "Verfügbare Befehle:"
    content: |
      <code>/chart</code> - Chart mit Indikatoren erhalten
      <code>/text_result</code> - Textanalyse erhalten
      <code>/preferences</code> - Indikator-Einstellungen
      <code>/parameters</code> - Indikator-Feineinstellungen
      <code>/create_signal</code> - Automatische Signale einrichten
      <code>/manage_signals</code> - Signale verwalten
      <code>/help</code> - Hilfe erhalten
      <code>/tutorial</code> - Tutorial wiederholen
      <code>/language</code> - Sprache ändern

  happy_trading: "Viel Erfolg beim Trading! 📈\n\nVerwenden Sie <code>/help</code> für Hilfe."

