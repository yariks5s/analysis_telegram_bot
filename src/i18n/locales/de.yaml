help:
  title: "CryptoBot Hilfe"
  main: |
    Hier sind die Hauptbefehle, die Sie verwenden können:
    
    <b>/chart &lt;symbol&gt; &lt;länge&gt; &lt;intervall&gt; &lt;toleranz&gt;</b>
    <b>/text_result &lt;symbol&gt; &lt;länge&gt; &lt;intervall&gt; &lt;toleranz&gt;</b>
    <b>/history &lt;symbol&gt; &lt;länge&gt; &lt;intervall&gt; &lt;toleranz&gt; &lt;zeitstempel&gt;</b>
    <b>/preferences</b>
    <b>/create_signal &lt;symbol&gt; &lt;minuten&gt; [&lt;mit_chart&gt;]</b>
    <b>/delete_signal &lt;symbol&gt;</b>
    <b>/manage_signals</b>
    <b>/sql &lt;abfrage&gt;</b>
    <b>/tables</b>
    <b>/schema &lt;tabellenname&gt;</b>
    <b>/language</b>
    <b>/help &lt;befehl&gt;</b>
    
    Geben Sie <code>/help &lt;befehl&gt;</code> für detaillierte Hilfe ein.
    
    Beispiel: <code>/help chart</code>
    
    Für mehr Details siehe README oder kontaktieren Sie den Maintainer (@yarik_is_working).

  commands:
    parameters: |
      <b>/parameters</b>
      Öffnen Sie ein interaktives Menü zur Anpassung der Indikator-Parameter.

    chart: |
      <b>/chart &lt;symbol&gt; &lt;länge&gt; &lt;intervall&gt; &lt;toleranz&gt;</b>
      Erhalten Sie ein Kerzen-Chart mit allen aktivierten Indikatoren.
      
      Beispiel: <code>/chart BTCUSDT 48 1h 0.05</code>

    text_result: |
      <b>/text_result &lt;symbol&gt; &lt;länge&gt; &lt;intervall&gt; &lt;toleranz&gt;</b>
      Erhalten Sie eine Textzusammenfassung aller erkannten Indikatoren.
      
      Beispiel: <code>/text_result ETHUSDT 24 15m 0.03</code>

    history: |
      <b>/history &lt;symbol&gt; &lt;länge&gt; &lt;intervall&gt; &lt;toleranz&gt; &lt;zeitstempel&gt;</b>
      Erhalten Sie ein Kerzen-Chart für historische Daten zu einem bestimmten Zeitstempel.
      
      Beispiel: <code>/history BTCUSDT 48 1h 0.05 1700000000</code>

    preferences: |
      <b>/preferences</b>
      Öffnen Sie ein interaktives Menü zur Auswahl der Indikatoren und Chart-Optionen.

    create_signal: |
      <b>/create_signal &lt;symbol&gt; &lt;minuten&gt; [&lt;mit_chart&gt;]</b>
      Beginnen Sie, automatische Signale für ein Paar mit einer bestimmten Frequenz zu erhalten.
      
      Beispiel: <code>/create_signal BTCUSDT 60 true</code>

    delete_signal: |
      <b>/delete_signal &lt;symbol&gt;</b>
      Stoppen Sie automatische Signale für ein Paar.

    manage_signals: |
      <b>/manage_signals</b>
      Öffnen Sie ein interaktives Menü zum Anzeigen, Hinzufügen oder Löschen Ihrer Signale.

    help: |
      <b>/help</b>
      Zeigen Sie die allgemeine Hilfemeldung an.

    sql: |
      <b>/sql &lt;abfrage&gt;</b>
      Führen Sie eine SQL-Abfrage gegen die Datenbank aus.

    tables: |
      <b>/tables</b>
      Zeigen Sie eine Liste aller verfügbaren Tabellen in der Datenbank.

    schema: |
      <b>/schema &lt;tabellenname&gt;</b>
      Zeigen Sie das Schema einer bestimmten Tabelle.

    language: |
      <b>/language</b>
      Ändern Sie die Sprache des Bots.

