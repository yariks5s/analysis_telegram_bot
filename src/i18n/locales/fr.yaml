tutorial:
  welcome:
    title: "🎉 Bienvenue sur CryptoBot !"
    content: |
      Je suis votre assistant personnel d'analyse du marché crypto. Je peux vous aider à analyser les graphiques de cryptomonnaies avec des indicateurs techniques avancés.
      
      Ce court tutoriel vous montrera comment utiliser mes fonctionnalités principales. Vous pouvez passer le tutoriel ou y revenir à tout moment avec la commande /tutorial.

  chart:
    title: "📊 Analyse de graphique"
    content: |
      La commande de base pour obtenir une analyse de graphique est :
      
      <code>/chart SYMBOLE LONGUEUR INTERVALLE TOLÉRANCE</code>
      
      Par exemple : <code>/chart BTCUSDT 48 1h 0.05</code>
      
      Cela vous donne un graphique de 48 bougies sur 1 heure pour BTC/USDT avec une tolérance de 0.05 pour la détection des niveaux de liquidité.
      
      Essayez-le ou continuez pour en savoir plus !

  preferences:
    title: "⚙️ Personnalisation des indicateurs"
    content: |
      Vous pouvez personnaliser les indicateurs qui apparaissent sur vos graphiques avec la commande <code>/preferences</code>.
      
      Cela ouvre un menu interactif où vous pouvez activer ou désactiver :
      • Order Blocks
      • Fair Value Gaps (FVGs)
      • Niveaux de liquidité
      • Breaker Blocks
      • Et modifier les options d'affichage
      
      Vos préférences seront sauvegardées pour les futures requêtes.

  signals:
    title: "🔔 Signaux automatiques"
    content: |
      Vous voulez recevoir des notifications automatiques ? Configurez des alertes de signal avec :
      
      <code>/create_signal SYMBOLE MINUTES [GRAPHIQUE]</code>
      
      Par exemple : <code>/create_signal BTCUSDT 60 true</code>
      
      Cela vous enverra une notification avec graphique toutes les 60 minutes pour BTC/USDT.
      
      Vous pouvez gérer vos signaux avec la commande <code>/manage_signals</code>.

  parameters:
    title: "🔧 Paramètres avancés"
    content: |
      Affinez les paramètres des indicateurs avec la commande <code>/parameters</code>.
      
      Vous pouvez ajuster :
      • Période ATR : pour le calcul de l'Average True Range
      • Taille min. FVG : taille minimale pour les Fair Value Gaps
      
      Ces paramètres affectent le calcul et l'affichage des indicateurs.

  completed:
    title: "🚀 Tutoriel terminé !"
    content: |
      Excellent ! Vous avez terminé le tutoriel CryptoBot.
      
      N'oubliez pas, vous pouvez toujours obtenir de l'aide avec :
      • <code>/help</code> - Aide générale
      • <code>/help COMMANDE</code> - Aide pour une commande spécifique
      
      Prêt à commencer ? Essayez <code>/chart BTCUSDT 48 1h 0.05</code> pour une analyse BTC/USDT !

  buttons:
    continue: "Continuer"
    skip_tutorial: "Passer le tutoriel"
    skip_to_end: "Aller à la fin"
    complete: "Terminer le tutoriel"
    view_commands: "Voir les commandes"
    back_to_tutorial: "Retour au tutoriel"

  welcome_back:
    title: "Bon retour sur CryptoBot !"
    content: |
      Vous avez déjà terminé le tutoriel. Que souhaitez-vous faire ?
      
      • Obtenir un graphique : <code>/chart BTCUSDT 48 1h 0.05</code>
      • Définir les préférences : <code>/preferences</code>
      • Créer des signaux : <code>/create_signal</code>
      • Revoir le tutoriel : <code>/tutorial</code>

  commands_list:
    title: "Commandes disponibles :"
    content: |
      <code>/chart</code> - Obtenir un graphique avec indicateurs
      <code>/text_result</code> - Obtenir une analyse textuelle
      <code>/preferences</code> - Paramètres des indicateurs
      <code>/parameters</code> - Réglages fins des indicateurs
      <code>/create_signal</code> - Configurer des signaux automatiques
      <code>/manage_signals</code> - Gérer les signaux
      <code>/help</code> - Obtenir de l'aide
      <code>/tutorial</code> - Revoir le tutoriel
      <code>/language</code> - Changer de langue

  happy_trading: "Bon trading ! 📈\n\nUtilisez <code>/help</code> pour obtenir de l'aide."

