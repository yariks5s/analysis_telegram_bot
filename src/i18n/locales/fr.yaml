help:
  title: "Aide CryptoBot"
  main: |
    Voici les commandes principales que vous pouvez utiliser :
    
    <b>/chart &lt;symbole&gt; &lt;longueur&gt; &lt;intervalle&gt; &lt;tolérance&gt;</b>
    <b>/text_result &lt;symbole&gt; &lt;longueur&gt; &lt;intervalle&gt; &lt;tolérance&gt;</b>
    <b>/history &lt;symbole&gt; &lt;longueur&gt; &lt;intervalle&gt; &lt;tolérance&gt; &lt;timestamp&gt;</b>
    <b>/preferences</b>
    <b>/create_signal &lt;symbole&gt; &lt;minutes&gt; [&lt;avec_graphique&gt;]</b>
    <b>/delete_signal &lt;symbole&gt;</b>
    <b>/manage_signals</b>
    <b>/sql &lt;requête&gt;</b>
    <b>/tables</b>
    <b>/schema &lt;nom_table&gt;</b>
    <b>/language</b>
    <b>/help &lt;commande&gt;</b>
    
    Tapez <code>/help &lt;commande&gt;</code> pour une aide détaillée.
    
    Exemple : <code>/help chart</code>
    
    Pour plus de détails, voir le README ou contacter le mainteneur (@yarik_is_working).

  commands:
    parameters: |
      <b>/parameters</b>
      Ouvrir un menu interactif pour personnaliser les paramètres des indicateurs.

    chart: |
      <b>/chart &lt;symbole&gt; &lt;longueur&gt; &lt;intervalle&gt; &lt;tolérance&gt;</b>
      Obtenir un graphique en chandeliers avec tous les indicateurs activés.
      
      Exemple : <code>/chart BTCUSDT 48 1h 0.05</code>

    text_result: |
      <b>/text_result &lt;symbole&gt; &lt;longueur&gt; &lt;intervalle&gt; &lt;tolérance&gt;</b>
      Obtenir un résumé textuel de tous les indicateurs détectés.
      
      Exemple : <code>/text_result ETHUSDT 24 15m 0.03</code>

    history: |
      <b>/history &lt;symbole&gt; &lt;longueur&gt; &lt;intervalle&gt; &lt;tolérance&gt; &lt;timestamp&gt;</b>
      Obtenir un graphique en chandeliers pour les données historiques à un timestamp spécifié.
      
      Exemple : <code>/history BTCUSDT 48 1h 0.05 1700000000</code>

    preferences: |
      <b>/preferences</b>
      Ouvrir un menu interactif pour sélectionner les indicateurs et les options de graphique.

    create_signal: |
      <b>/create_signal &lt;symbole&gt; &lt;minutes&gt; [&lt;avec_graphique&gt;]</b>
      Commencer à recevoir des signaux automatiques pour une paire à une fréquence donnée.
      
      Exemple : <code>/create_signal BTCUSDT 60 true</code>

    delete_signal: |
      <b>/delete_signal &lt;symbole&gt;</b>
      Arrêter les signaux automatiques pour une paire.

    manage_signals: |
      <b>/manage_signals</b>
      Ouvrir un menu interactif pour voir, ajouter ou supprimer vos signaux.

    help: |
      <b>/help</b>
      Afficher le message d'aide général.

    sql: |
      <b>/sql &lt;requête&gt;</b>
      Exécuter une requête SQL sur la base de données.

    tables: |
      <b>/tables</b>
      Afficher la liste de toutes les tables disponibles dans la base de données.

    schema: |
      <b>/schema &lt;nom_table&gt;</b>
      Afficher le schéma d'une table spécifique.

    language: |
      <b>/language</b>
      Changer la langue du bot.

