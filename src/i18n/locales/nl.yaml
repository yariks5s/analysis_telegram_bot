help:
  title: "CryptoBot Help"
  main: |
    Hier zijn de belangrijkste commando's die u kunt gebruiken:
    
    <b>/chart &lt;symbool&gt; &lt;lengte&gt; &lt;interval&gt; &lt;tolerantie&gt;</b>
    <b>/text_result &lt;symbool&gt; &lt;lengte&gt; &lt;interval&gt; &lt;tolerantie&gt;</b>
    <b>/history &lt;symbool&gt; &lt;lengte&gt; &lt;interval&gt; &lt;tolerantie&gt; &lt;timestamp&gt;</b>
    <b>/preferences</b>
    <b>/create_signal &lt;symbool&gt; &lt;minuten&gt; [&lt;met_grafiek&gt;]</b>
    <b>/delete_signal &lt;symbool&gt;</b>
    <b>/manage_signals</b>
    <b>/sql &lt;query&gt;</b>
    <b>/tables</b>
    <b>/schema &lt;tabelnaam&gt;</b>
    <b>/language</b>
    <b>/help &lt;commando&gt;</b>
    
    Typ <code>/help &lt;commando&gt;</code> voor gedetailleerde hulp.
    
    Voorbeeld: <code>/help chart</code>
    
    Voor meer details, zie de README of neem contact op met de beheerder (@yarik_is_working).

  commands:
    parameters: |
      <b>/parameters</b>
      Open een interactief menu om indicatorparameters aan te passen.

    chart: |
      <b>/chart &lt;symbool&gt; &lt;lengte&gt; &lt;interval&gt; &lt;tolerantie&gt;</b>
      Krijg een candlestick-grafiek met alle ingeschakelde indicatoren.
      
      Voorbeeld: <code>/chart BTCUSDT 48 1h 0.05</code>

    text_result: |
      <b>/text_result &lt;symbool&gt; &lt;lengte&gt; &lt;interval&gt; &lt;tolerantie&gt;</b>
      Krijg een tekstsamenvatting van alle gedetecteerde indicatoren.
      
      Voorbeeld: <code>/text_result ETHUSDT 24 15m 0.03</code>

    history: |
      <b>/history &lt;symbool&gt; &lt;lengte&gt; &lt;interval&gt; &lt;tolerantie&gt; &lt;timestamp&gt;</b>
      Krijg een candlestick-grafiek voor historische gegevens op een opgegeven timestamp.
      
      Voorbeeld: <code>/history BTCUSDT 48 1h 0.05 1700000000</code>

    preferences: |
      <b>/preferences</b>
      Open een interactief menu om indicatoren en grafiekopties te selecteren.

    create_signal: |
      <b>/create_signal &lt;symbool&gt; &lt;minuten&gt; [&lt;met_grafiek&gt;]</b>
      Begin met het ontvangen van automatische signalen voor een paar met een bepaalde frequentie.
      
      Voorbeeld: <code>/create_signal BTCUSDT 60 true</code>

    delete_signal: |
      <b>/delete_signal &lt;symbool&gt;</b>
      Stop automatische signalen voor een paar.

    manage_signals: |
      <b>/manage_signals</b>
      Open een interactief menu om uw signalen te bekijken, toe te voegen of te verwijderen.

    help: |
      <b>/help</b>
      Toon het algemene helpbericht.

    sql: |
      <b>/sql &lt;query&gt;</b>
      Voer een SQL-query uit op de database.

    tables: |
      <b>/tables</b>
      Toon een lijst van alle beschikbare tabellen in de database.

    schema: |
      <b>/schema &lt;tabelnaam&gt;</b>
      Toon het schema van een specifieke tabel.

    language: |
      <b>/language</b>
      Wijzig de taal van de bot.

