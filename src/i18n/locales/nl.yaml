tutorial:
  welcome:
    title: "🎉 Welkom bij CryptoBot!"
    content: |
      Ik ben uw persoonlijke assistent voor crypto-marktanalyse. Ik kan u helpen bij het analyseren van cryptocurrency-grafieken met geavanceerde technische indicatoren.
      
      Deze korte tutorial laat u zien hoe u mijn belangrijkste functies kunt gebruiken. U kunt de tutorial overslaan of er op elk moment naar terugkeren met het /tutorial commando.

  chart:
    title: "📊 Grafiekanalyse"
    content: |
      Het basiscommando voor een grafiekanalyse is:
      
      <code>/chart SYMBOOL LENGTE INTERVAL TOLERANTIE</code>
      
      Bijvoorbeeld: <code>/chart BTCUSDT 48 1h 0.05</code>
      
      Dit geeft u een 48-kaarsen, 1-uurs grafiek voor BTC/USDT met een tolerantie van 0.05 voor het detecteren van liquiditeitsniveaus.
      
      Probeer het uit of ga verder om meer te leren!

  preferences:
    title: "⚙️ Indicatoren aanpassen"
    content: |
      U kunt aanpassen welke indicatoren op uw grafieken verschijnen met het <code>/preferences</code> commando.
      
      Dit opent een interactief menu waar u kunt in- of uitschakelen:
      • Order Blocks
      • Fair Value Gaps (FVGs)
      • Liquiditeitsniveaus
      • Breaker Blocks
      • En weergave-opties wijzigen
      
      Uw voorkeuren worden opgeslagen voor toekomstige verzoeken.

  signals:
    title: "🔔 Automatische signalen"
    content: |
      Wilt u automatische meldingen ontvangen? Stel signaalalerts in met:
      
      <code>/create_signal SYMBOOL MINUTEN [GRAFIEK]</code>
      
      Bijvoorbeeld: <code>/create_signal BTCUSDT 60 true</code>
      
      Dit stuurt u elke 60 minuten een melding met grafiek voor BTC/USDT.
      
      U kunt uw signalen beheren met het <code>/manage_signals</code> commando.

  parameters:
    title: "🔧 Geavanceerde parameters"
    content: |
      Verfijn indicatorparameters met het <code>/parameters</code> commando.
      
      U kunt aanpassen:
      • ATR-periode: voor het berekenen van de Average True Range
      • FVG min. grootte: minimale grootte voor Fair Value Gaps
      
      Deze instellingen beïnvloeden hoe indicatoren worden berekend en weergegeven.

  completed:
    title: "🚀 Tutorial voltooid!"
    content: |
      Geweldig! U hebt de CryptoBot-tutorial voltooid.
      
      Onthoud, u kunt altijd hulp krijgen met:
      • <code>/help</code> - Algemene hulp
      • <code>/help COMMANDO</code> - Hulp voor een specifiek commando
      
      Klaar om te beginnen? Probeer <code>/chart BTCUSDT 48 1h 0.05</code> voor een BTC/USDT-analyse!

  buttons:
    continue: "Doorgaan"
    skip_tutorial: "Tutorial overslaan"
    skip_to_end: "Naar het einde"
    complete: "Tutorial voltooien"
    view_commands: "Commando's bekijken"
    back_to_tutorial: "Terug naar tutorial"

  welcome_back:
    title: "Welkom terug bij CryptoBot!"
    content: |
      U hebt de tutorial al voltooid. Wat wilt u doen?
      
      • Een grafiek krijgen: <code>/chart BTCUSDT 48 1h 0.05</code>
      • Voorkeuren instellen: <code>/preferences</code>
      • Signalen maken: <code>/create_signal</code>
      • Tutorial herhalen: <code>/tutorial</code>

  commands_list:
    title: "Beschikbare commando's:"
    content: |
      <code>/chart</code> - Grafiek met indicatoren
      <code>/text_result</code> - Tekstanalyse
      <code>/preferences</code> - Indicatorvoorkeuren
      <code>/parameters</code> - Indicatorinstellingen
      <code>/create_signal</code> - Automatische signalen instellen
      <code>/manage_signals</code> - Signalen beheren
      <code>/help</code> - Hulp krijgen
      <code>/tutorial</code> - Tutorial herhalen
      <code>/language</code> - Taal wijzigen

  happy_trading: "Veel succes met handelen! 📈\n\nGebruik <code>/help</code> voor hulp."

