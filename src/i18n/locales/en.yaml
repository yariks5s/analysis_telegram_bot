# Tutorial messages
tutorial:
  welcome:
    title: "🎉 Welcome to CryptoBot!"
    content: |
      I'm your personal crypto market analysis assistant. I can help you analyze cryptocurrency charts with advanced technical indicators.
      
      This short tutorial will show you how to use my main features. You can skip the tutorial or come back to it anytime with the /tutorial command.
  
  chart:
    title: "📊 Chart Analysis"
    content: |
      The basic command to get a chart analysis is:
      
      <code>/chart SYMBOL LENGTH INTERVAL TOLERANCE</code>
      
      For example: <code>/chart BTCUSDT 48 1h 0.05</code>
      
      This gives you a 48-candle, 1-hour chart for BTC/USDT with a tolerance of 0.05 for detecting liquidity levels.
      
      Try it out or continue to learn more features!
  
  preferences:
    title: "⚙️ Customizing Indicators"
    content: |
      You can customize which indicators appear on your charts with the <code>/preferences</code> command.
      
      This opens an interactive menu where you can enable or disable:
      • Order Blocks
      • Fair Value Gaps (FVGs)
      • Liquidity Levels
      • Breaker Blocks
      • And change display options
      
      Your preferences will be saved for future chart requests.
  
  signals:
    title: "🔔 Automated Signals"
    content: |
      Want to receive automatic notifications? Set up signal alerts with:
      
      <code>/create_signal SYMBOL MINUTES [CHART]</code>
      
      For example: <code>/create_signal BTCUSDT 60 true</code>
      
      This will send you a notification with a chart every 60 minutes for BTC/USDT.
      
      You can manage your signals with the <code>/manage_signals</code> command.
  
  parameters:
    title: "🔧 Advanced Parameters"
    content: |
      Fine-tune indicator parameters with the <code>/parameters</code> command.
      
      You can adjust:
      • ATR Period: for calculating Average True Range
      • FVG Min Size: minimum size for Fair Value Gaps
      
      These settings affect how indicators are calculated and displayed.
  
  completed:
    title: "🚀 Tutorial Completed!"
    content: |
      Great job! You've completed the CryptoBot tutorial.
      
      Remember, you can always get help with:
      • <code>/help</code> - General help information
      • <code>/help COMMAND</code> - Help for a specific command
      
      Ready to start? Try <code>/chart BTCUSDT 48 1h 0.05</code> to see BTC/USDT analysis!
  
  buttons:
    continue: "Continue"
    skip_tutorial: "Skip Tutorial"
    skip_to_end: "Skip to End"
    complete: "Complete Tutorial"
    view_commands: "View Available Commands"
    back_to_tutorial: "Back to Tutorial"
  
  welcome_back:
    title: "Welcome back to CryptoBot!"
    content: |
      You've already completed the tutorial. What would you like to do?
      
      • Get a chart with <code>/chart BTCUSDT 48 1h 0.05</code>
      • Set preferences with <code>/preferences</code>
      • Create signals with <code>/create_signal</code>
      • Review the tutorial with <code>/tutorial</code>
  
  commands_list:
    title: "Available Commands:"
    content: |
      <code>/chart</code> - Get a chart with indicators
      <code>/text_result</code> - Get a text analysis
      <code>/preferences</code> - Set indicator preferences
      <code>/parameters</code> - Fine-tune indicator settings
      <code>/create_signal</code> - Set up automatic signals
      <code>/manage_signals</code> - Manage your signal alerts
      <code>/help</code> - Get help with commands
      <code>/tutorial</code> - Revisit this tutorial
      <code>/language</code> - Change language
  
  happy_trading: "Happy trading! 📈\n\nUse <code>/help</code> anytime you need assistance."

