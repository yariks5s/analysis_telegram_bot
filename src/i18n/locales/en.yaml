# Help messages
help:
  title: "CryptoBot Help"
  main: |
    Here are the main commands you can use:
    
    <b>/chart &lt;symbol&gt; &lt;length&gt; &lt;interval&gt; &lt;tolerance&gt;</b>
    <b>/text_result &lt;symbol&gt; &lt;length&gt; &lt;interval&gt; &lt;tolerance&gt;</b>
    <b>/history &lt;symbol&gt; &lt;length&gt; &lt;interval&gt; &lt;tolerance&gt; &lt;timestamp&gt;</b>
    <b>/preferences</b>
    <b>/create_signal &lt;symbol&gt; &lt;minutes&gt; [&lt;show_chart&gt;]</b>
    <b>/delete_signal &lt;symbol&gt;</b>
    <b>/manage_signals</b>
    <b>/sql &lt;query&gt;</b>
    <b>/tables</b>
    <b>/schema &lt;table_name&gt;</b>
    <b>/language</b>
    <b>/help &lt;command&gt;</b>
    
    Type <code>/help &lt;command&gt;</code> to get detailed help for a specific command.
    
    Example: <code>/help chart</code>
    
    For more details, see the README or contact the maintainer (@yarik_is_working).
  
  commands:
    parameters: |
      <b>/parameters</b>
      Open an interactive menu to customize indicator parameters.
      
      Available parameters:
      - ATR Period: Adjust the period used for Average True Range calculations (1-50)
      - FVG Min Size: Set the minimum size ratio for Fair Value Gaps (0.0001-0.01)
      
      Click on any parameter to modify its value.
    
    chart: |
      <b>/chart &lt;symbol&gt; &lt;length&gt; &lt;interval&gt; &lt;tolerance&gt;</b>
      Get a candlestick chart with all enabled indicators.
      
      - <b>symbol</b>: The trading pair, e.g. BTCUSDT
      - <b>length</b>: Amount of candles to analyze (e.g. 48)
      - <b>interval</b>: Candle interval (e.g. 1h, 15m)
      - <b>tolerance</b>: Sensitivity for liquidity level detection (0-1, e.g. 0.05 = more levels, 0.2 = fewer, only strongest)
      
      Example: <code>/chart BTCUSDT 48 1h 0.05</code>
      
      The chart will include all indicators you have enabled in your preferences.
    
    text_result: |
      <b>/text_result &lt;symbol&gt; &lt;length&gt; &lt;interval&gt; &lt;tolerance&gt;</b>
      Get a text summary of all detected indicators for the specified symbol and timeframe.
      
      Example: <code>/text_result ETHUSDT 24 15m 0.03</code>
    
    history: |
      <b>/history &lt;symbol&gt; &lt;length&gt; &lt;interval&gt; &lt;tolerance&gt; &lt;timestamp&gt;</b>
      Get a candlestick chart for historical data at a specified timestamp.
      
      - <b>symbol</b>: The trading pair, e.g. BTCUSDT
      - <b>length</b>: Number of candles to analyze
      - <b>interval</b>: Candle interval (e.g., 1h, 15m)
      - <b>tolerance</b>: Sensitivity for liquidity level detection (0-1)
      - <b>timestamp</b>: Unix epoch seconds for the end of the period
      
      Example: <code>/history BTCUSDT 48 1h 0.05 1700000000</code>
    
    preferences: |
      <b>/preferences</b>
      Open an interactive menu to select which indicators to use and chart options.
      
      Available options:
      - Technical indicators (Order Blocks, FVGs, Liquidity Levels, etc.)
      - Display settings (Show Legend, Show Volume)
      - Theme selection (Light/Dark mode)
    
    create_signal: |
      <b>/create_signal &lt;symbol&gt; &lt;minutes&gt; [&lt;show_chart&gt;]</b>
      Start receiving auto-signals for a pair at a given frequency (in minutes).
      
      - <b>symbol</b>: The trading pair, e.g. BTCUSDT
      - <b>minutes</b>: Frequency in minutes to receive signals
      - <b>show_chart</b> (optional): true/false, whether to include a chart with each signal (default: false)
      
      Example: <code>/create_signal BTCUSDT 60 true</code>
      
      You can have up to 10 active signal jobs per user.
    
    delete_signal: |
      <b>/delete_signal &lt;symbol&gt;</b>
      Stop auto-signals for a pair.
      
      Example: <code>/delete_signal BTCUSDT</code>
    
    manage_signals: |
      <b>/manage_signals</b>
      Open an interactive menu to view, add, or delete your signal jobs.
      
      You can have up to 10 active signal jobs per user.
    
    help: |
      <b>/help</b>
      Show the general help message.
      
      <b>/help &lt;command&gt;</b>
      Show detailed help for a specific command.
      
      Example: <code>/help chart</code>
    
    sql: |
      <b>/sql &lt;query&gt;</b>
      Execute a custom SQL query against the database.
      
      Example queries:
      - <code>/sql SELECT * FROM trades LIMIT 5</code>
      - <code>/sql SELECT symbol, COUNT(*) as trades FROM trades GROUP BY symbol</code>
      - <code>/sql SELECT AVG(profit_loss) as avg_profit FROM trades WHERE symbol = 'BTCUSDT'</code>
      
      Note: Results are limited to 50 rows for readability.
    
    tables: |
      <b>/tables</b>
      Show a list of all available tables in the database.
      
      Use this command to see what tables you can query with /sql.
    
    schema: |
      <b>/schema &lt;table_name&gt;</b>
      Show the schema (structure) of a specific table.
      
      Example: <code>/schema trades</code>
      
      This will show you all columns and their data types in the specified table.
    
    language: |
      <b>/language</b>
      Change the bot's language.
      
      Supported languages:
      - 🇬🇧 English
      - 🇷🇺 Русский (Russian)
      - 🇺🇦 Українська (Ukrainian)
      - 🇩🇪 Deutsch (German)
      - 🇫🇷 Français (French)
      - 🇳🇱 Nederlands (Dutch)

