help:
  title: "Справка CryptoBot"
  main: |
    Вот основные команды:
    
    <b>/chart &lt;символ&gt; &lt;длина&gt; &lt;интервал&gt; &lt;допуск&gt;</b>
    <b>/text_result &lt;символ&gt; &lt;длина&gt; &lt;интервал&gt; &lt;допуск&gt;</b>
    <b>/history &lt;символ&gt; &lt;длина&gt; &lt;интервал&gt; &lt;допуск&gt; &lt;время&gt;</b>
    <b>/preferences</b>
    <b>/create_signal &lt;символ&gt; &lt;минуты&gt; [&lt;с_графиком&gt;]</b>
    <b>/delete_signal &lt;символ&gt;</b>
    <b>/manage_signals</b>
    <b>/sql &lt;запрос&gt;</b>
    <b>/tables</b>
    <b>/schema &lt;имя_таблицы&gt;</b>
    <b>/language</b>
    <b>/help &lt;команда&gt;</b>
    
    Введите <code>/help &lt;команда&gt;</code> для подробной справки.
    
    Пример: <code>/help chart</code>
    
    Для подробностей см. README или свяжитесь с разработчиком (@yarik_is_working).

  commands:
    parameters: |
      <b>/parameters</b>
      Открыть интерактивное меню для настройки параметров индикаторов.
      
      Доступные параметры:
      - Период ATR: Настройка периода для расчёта среднего истинного диапазона (1-50)
      - Мин. размер FVG: Установка минимального соотношения размера для зон справедливой стоимости (0.0001-0.01)
      
      Нажмите на любой параметр, чтобы изменить его значение.

    chart: |
      <b>/chart &lt;символ&gt; &lt;длина&gt; &lt;интервал&gt; &lt;допуск&gt;</b>
      Получить свечной график со всеми включёнными индикаторами.
      
      - <b>символ</b>: Торговая пара, например BTCUSDT
      - <b>длина</b>: Количество свечей для анализа (например, 48)
      - <b>интервал</b>: Интервал свечей (например, 1h, 15m)
      - <b>допуск</b>: Чувствительность для определения уровней ликвидности (0-1)
      
      Пример: <code>/chart BTCUSDT 48 1h 0.05</code>

    text_result: |
      <b>/text_result &lt;символ&gt; &lt;длина&gt; &lt;интервал&gt; &lt;допуск&gt;</b>
      Получить текстовую сводку всех обнаруженных индикаторов.
      
      Пример: <code>/text_result ETHUSDT 24 15m 0.03</code>

    history: |
      <b>/history &lt;символ&gt; &lt;длина&gt; &lt;интервал&gt; &lt;допуск&gt; &lt;время&gt;</b>
      Получить свечной график для исторических данных на указанную метку времени.
      
      - <b>время</b>: Метка времени Unix в секундах
      
      Пример: <code>/history BTCUSDT 48 1h 0.05 1700000000</code>

    preferences: |
      <b>/preferences</b>
      Открыть интерактивное меню для выбора индикаторов и настроек графика.
      
      Доступные опции:
      - Технические индикаторы (Ордер-блоки, FVG, Уровни ликвидности и т.д.)
      - Настройки отображения (Показать легенду, Показать объём)
      - Выбор темы (Светлая/Тёмная)

    create_signal: |
      <b>/create_signal &lt;символ&gt; &lt;минуты&gt; [&lt;с_графиком&gt;]</b>
      Начать получать автоматические сигналы для пары с заданной частотой (в минутах).
      
      Пример: <code>/create_signal BTCUSDT 60 true</code>
      
      Максимум 10 активных сигналов на пользователя.

    delete_signal: |
      <b>/delete_signal &lt;символ&gt;</b>
      Остановить автоматические сигналы для пары.
      
      Пример: <code>/delete_signal BTCUSDT</code>

    manage_signals: |
      <b>/manage_signals</b>
      Открыть интерактивное меню для просмотра, добавления или удаления сигналов.
      
      Максимум 10 активных сигналов на пользователя.

    help: |
      <b>/help</b>
      Показать общее сообщение справки.
      
      <b>/help &lt;команда&gt;</b>
      Показать подробную справку для конкретной команды.
      
      Пример: <code>/help chart</code>

    sql: |
      <b>/sql &lt;запрос&gt;</b>
      Выполнить SQL-запрос к базе данных.
      
      Примеры:
      - <code>/sql SELECT * FROM trades LIMIT 5</code>
      
      Результаты ограничены 50 строками.

    tables: |
      <b>/tables</b>
      Показать список всех доступных таблиц в базе данных.

    schema: |
      <b>/schema &lt;имя_таблицы&gt;</b>
      Показать структуру конкретной таблицы.
      
      Пример: <code>/schema trades</code>

    language: |
      <b>/language</b>
      Изменить язык бота.
      
      Поддерживаемые языки:
      - 🇬🇧 English
      - 🇷🇺 Русский
      - 🇺🇦 Українська
      - 🇩🇪 Deutsch
      - 🇫🇷 Français
      - 🇳🇱 Nederlands

