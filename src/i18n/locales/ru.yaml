tutorial:
  welcome:
    title: "🎉 Добро пожаловать в CryptoBot!"
    content: |
      Я ваш персональный помощник для анализа криптовалютного рынка. Я помогу вам анализировать графики криптовалют с продвинутыми техническими индикаторами.
      
      Это краткое обучение покажет вам, как использовать мои основные функции. Вы можете пропустить обучение или вернуться к нему в любое время с помощью команды /tutorial.

  chart:
    title: "📊 Анализ графика"
    content: |
      Основная команда для получения анализа графика:
      
      <code>/chart СИМВОЛ ДЛИНА ИНТЕРВАЛ ДОПУСК</code>
      
      Например: <code>/chart BTCUSDT 48 1h 0.05</code>
      
      Это даст вам 48-свечный часовой график для BTC/USDT с допуском 0.05 для определения уровней ликвидности.
      
      Попробуйте или продолжите, чтобы узнать больше!

  preferences:
    title: "⚙️ Настройка индикаторов"
    content: |
      Вы можете настроить, какие индикаторы отображаются на графиках, с помощью команды <code>/preferences</code>.
      
      Откроется интерактивное меню, где вы можете включить или отключить:
      • Ордер-блоки
      • Зоны справедливой стоимости (FVG)
      • Уровни ликвидности
      • Брейкер-блоки
      • И изменить настройки отображения
      
      Ваши настройки будут сохранены для будущих запросов.

  signals:
    title: "🔔 Автоматические сигналы"
    content: |
      Хотите получать автоматические уведомления? Настройте сигнальные оповещения с помощью:
      
      <code>/create_signal СИМВОЛ МИНУТЫ [ГРАФИК]</code>
      
      Например: <code>/create_signal BTCUSDT 60 true</code>
      
      Это будет отправлять вам уведомление с графиком каждые 60 минут для BTC/USDT.
      
      Управлять сигналами можно командой <code>/manage_signals</code>.

  parameters:
    title: "🔧 Расширенные параметры"
    content: |
      Тонкая настройка параметров индикаторов через команду <code>/parameters</code>.
      
      Вы можете настроить:
      • Период ATR: для расчёта среднего истинного диапазона
      • Мин. размер FVG: минимальный размер зон справедливой стоимости
      
      Эти настройки влияют на расчёт и отображение индикаторов.

  completed:
    title: "🚀 Обучение завершено!"
    content: |
      Отлично! Вы завершили обучение CryptoBot.
      
      Помните, вы всегда можете получить помощь:
      • <code>/help</code> - Общая справка
      • <code>/help КОМАНДА</code> - Справка по конкретной команде
      
      Готовы начать? Попробуйте <code>/chart BTCUSDT 48 1h 0.05</code> для анализа BTC/USDT!

  buttons:
    continue: "Продолжить"
    skip_tutorial: "Пропустить обучение"
    skip_to_end: "Пропустить до конца"
    complete: "Завершить обучение"
    view_commands: "Показать команды"
    back_to_tutorial: "Назад к обучению"

  welcome_back:
    title: "С возвращением в CryptoBot!"
    content: |
      Вы уже завершили обучение. Что хотите сделать?
      
      • Получить график: <code>/chart BTCUSDT 48 1h 0.05</code>
      • Настроить предпочтения: <code>/preferences</code>
      • Создать сигналы: <code>/create_signal</code>
      • Повторить обучение: <code>/tutorial</code>

  commands_list:
    title: "Доступные команды:"
    content: |
      <code>/chart</code> - Получить график с индикаторами
      <code>/text_result</code> - Получить текстовый анализ
      <code>/preferences</code> - Настроить предпочтения индикаторов
      <code>/parameters</code> - Тонкая настройка индикаторов
      <code>/create_signal</code> - Настроить автоматические сигналы
      <code>/manage_signals</code> - Управление сигналами
      <code>/help</code> - Получить справку
      <code>/tutorial</code> - Повторить обучение
      <code>/language</code> - Сменить язык

  happy_trading: "Удачной торговли! 📈\n\nИспользуйте <code>/help</code> для получения помощи."

